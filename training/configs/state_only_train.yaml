# 比較実験: カメラを使わない ACT（講義のお辞儀デモと同じ入力構成）
# 同じデータセットで、入力から画像だけを外して学習する
dataset_root: "/workspace/dataset/lerobot_dataset/crane_vision_pick"
repo_id: "crane_vision_pick"
output_directory: "/workspace/checkpoints/train/crane_state_only_act"
input_keys: ["observation.state", "observation.environment_state"]
device: "auto"
training_steps: 20000
batch_size: 8
num_workers: 2
learning_rate: 1.0e-5
weight_decay: 1.0e-4
grad_clip_norm: 10.0
chunk_size: 20
n_action_steps: 5
kl_weight: 10.0
image_augmentation: false
val_ratio: 0.1
val_every: 1000
save_every: 5000
log_every: 100
seed: 0
use_wandb: false
